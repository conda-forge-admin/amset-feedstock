{% set name = "amset" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/amset-{{ version }}.tar.gz
  sha256: bb80bacedaef682b9e97faefb901f530b21eb8cf27ee3b208e5e5e6540f8f60b

build:
  entry_points:
    - amset = amset.tools.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - numpy
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - boltztrap2
    - click
    - h5py
    - interpolation
    - matplotlib-base
    - memory_profiler
    - monty
    - numba
    - pyfftw
    - pymatgen >=2022.0.16
    - python >={{ python_min }}
    - scipy
    - spglib
    - sumo
    - tabulate
    - tqdm

test:
  imports:
    - amset
  commands:
    - pip check
    - amset --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hackingmaterials/amset
  summary: AMSET is a tool to calculate carrier transport properties from ab initio calculation data
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
